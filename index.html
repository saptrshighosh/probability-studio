<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probability Studio</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#1b2430}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0002}
  h1{font-size:1.4rem;margin:8px 0} h2{font-size:1.1rem;margin:0 0 8px}
  label{display:block;margin:10px 0 4px;font-weight:600}
  input[type=text],input:not([type]){width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid #9aa5b1;border-radius:8px}
  .opt{display:flex;gap:10px;align-items:center;padding:12px;border:2px solid #cfd6dd;border-radius:10px;margin:8px 0;font-size:1.05rem}
  .opt input{width:20px;height:20px}
  button{width:100%;padding:14px;font-size:1.1rem;border:0;border-radius:10px;background:#0b6b3a;color:#fff;margin-top:12px}
  button:disabled{background:#8aa}
  .bar{display:flex;justify-content:space-between;font-weight:600}
  #timer{font-size:1.6rem;font-variant-numeric:tabular-nums}
  .err{color:#b00020}.good{color:#0b6b3a}.muted{color:#5b6773;font-size:.9rem}
  table{width:100%;border-collapse:collapse} td{padding:4px 0}
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="game1.js"></script>
<script src="game2.js"></script>
<script src="game3.js"></script>
<script src="game4.js"></script>
<script src="api.js"></script>
<script>
const $ = id => document.getElementById(id), app = $('app');
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => 'H$' + Math.round(n).toLocaleString('en-US');

let me = store.get('ps_user'), code = new URLSearchParams(location.search).get('code') || store.get('ps_code');
let st = null, mine = {}, allMine = [], pending = null, viewKey = '', started = false, badCode = false;

function loginView(msg) {
  viewKey = '';
  app.innerHTML = `<h1>🎄 Probability Studio</h1><div class="card">
    <label for="c">Session code (on the screen)</label><input id="c" value="${esc(code)}" autocapitalize="characters">
    <label for="u">OU username</label><input id="u" value="${esc(me)}" placeholder="e.g. abcd1234" autocapitalize="none">
    <button id="go">Join</button><p class="err" id="lm">${esc(msg || '')}</p></div>`;
  $('go').onclick = () => {
    const u = $('u').value.trim().toLowerCase(), c = $('c').value.trim();
    if (!/^[a-z0-9._-]{3,30}$/.test(u)) { $('lm').textContent = 'Username: 3-30 letters/numbers.'; return; }
    me = u; code = c; badCode = false; store.set('ps_user', me); store.set('ps_code', code);
    try { history.replaceState(null, '', location.pathname); } catch (e) {} // drop stale ?code= so a reload keeps the code just typed
    if (!started) { started = true; tick(); } else render();
  };
}

const isOpen = () => st && st.open_until && Date.parse(st.open_until) > API.now();
const upTo = () => (st.round === 0 ? 0 : (isOpen() ? st.round - 1 : st.round));

// kind 'num' = plain number ($, z-score...). Default = probability: "44.7%" or "44.7" become 0.447.
function parseAnswer(s, kind) {
  s = String(s).trim().replace(/[$,]/g, ''); if (!s) return null;
  let x = parseFloat(s); if (isNaN(x)) return null;
  if (kind !== 'num' && (s.includes('%') || x > 1)) x /= 100;
  return x;
}

function render() {
  if (!st) return;
  if (st.code.toLowerCase() !== code.toLowerCase()) {
    if (!badCode) { badCode = true; loginView('That session code does not match. Check the screen.'); }
    return;
  }
  badCode = false;
  const key = [st.game, st.round, isOpen(), !!mine[st.round], !!pending].join('|');
  if (key !== viewKey) { viewKey = key; draw(); }
  const t = $('timer');
  if (t) { const s = Math.max(0, Math.ceil((Date.parse(st.open_until) - API.now()) / 1000));
           t.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
}

function draw() {
  const G = GAMES[st.game], r = st.round;
  if (!G) { app.innerHTML = `<h1>🎄 Probability Studio</h1><div class="card"><h2>Game ${st.game} is not ready yet</h2></div>`; return; }
  const bal = Engine.cumulative(me, allMine, st.game, upTo());
  let html = `<h1>🎄 ${esc(G.name)}</h1><div class="card bar"><span>${esc(me)}</span><span>${money(bal)}</span></div>`;
  if (r === 0) {
    html += `<div class="card"><h2>Waiting for the instructor…</h2><p>${esc(G.intro)}</p><p class="muted">Keep this page open. The first question appears here by itself.</p></div>`;
  } else {
    const R = Engine.build(st.game, me, r);
    if (isOpen()) {
      html += `<div class="card"><div class="bar"><span>Round ${r} of ${G.rounds.length} · ${esc(R.lesson)}</span><span id="timer"></span></div></div>`;
      if (mine[r]) html += `<div class="card good"><h2>✓ Answer saved</h2><p>Wait for the timer to finish. Results appear here.</p></div>`;
      else if (pending) html += `<div class="card"><h2 class="err">⚠ Saving… not saved yet</h2><p>Keep this page open. It retries by itself.</p></div>`;
      else {
        html += `<div class="card"><h2>${esc(R.title)}</h2><p>${esc(R.story)}</p><form id="f">` +
          R.options.map(o => `<label class="opt"><input type="radio" name="ch" value="${o.id}"> ${esc(o.label)}</label>`).join('') +
          `<p class="muted">Optional bonus (+$${Engine.BONUS} each if close).</p>` +
          R.asks.map((a, i) => `<label for="n${i}">${esc(a.label)}${a.kind === 'num' ? '' : ' (decimal like 0.447, or %)'}</label><input id="n${i}" inputmode="${a.kind === 'num' ? 'text' : 'decimal'}">`).join('') +
          `<button type="submit" id="sub">Submit answer</button><p class="err" id="fm"></p></form></div>`;
      }
    } else {
      const res = Engine.result(R, mine[r]);
      const lab = id => R.options.find(o => o.id === id).label;
      html += `<div class="card"><h2>Round ${r} results · ${esc(R.lesson)}</h2>` +
        (res.answered ? `<p>You chose: <b>${esc(lab(mine[r].choice))}</b></p>` : `<p class="err">You did not answer in time. This counts as the worst option.</p>`) +
        `<p>Best choice: <b>${esc(lab(res.best))}</b></p>` +
        `<p>${res.delta < -0.005 ? 'Money left on the table: ' + money(-res.delta * Engine.SCALE) : '<span class="good">Perfect choice!</span>'}` +
        (res.bonus ? ` · Bonus: +${money(res.bonus * Engine.SCALE)}` : '') + `</p>` +
        `<table>` + R.options.map(o => `<tr><td>${esc(o.label)}</td><td align=right>net $${R.values[o.id].toFixed(2)}</td></tr>`).join('') + `</table>` +
        R.asks.map((a, i) => `<p class="muted">${esc(a.label)}: <b>${a.answer.toFixed(3)}</b> ${res.right[i] ? '✓' : ''}</p>`).join('') +
        `</div><p class="muted">Waiting for the next round…</p>`;
    }
  }
  app.innerHTML = html;
  const f = $('f'); if (f) f.onsubmit = submit;
}

async function submit(ev) {
  ev.preventDefault();
  const ch = document.querySelector('input[name=ch]:checked');
  if (!ch) { $('fm').textContent = 'Pick an option first.'; return; }
  const R = Engine.build(st.game, me, st.round);
  $('sub').disabled = true;
  pending = { student: me, game: st.game, round: st.round, choice: ch.value, nums: R.asks.map((a, i) => parseAnswer($('n' + i).value, a.kind)) };
  await trySubmit(); render();
}

async function trySubmit() {
  const row = pending; if (!row) return;
  try { await API.submit(row); mine[row.round] = row; pending = null; }
  catch (e) {
    if (e.status === 409) pending = null;                       // already saved earlier
    else if (/round closed/.test(e.message)) { pending = null; viewKey = ''; }   // too late
    // anything else (network): keep pending, retry on next tick
  }
}

async function tick() {
  try {
    st = await API.state();
    allMine = await API.mine(me);
    mine = {}; allMine.forEach(a => { if (a.game === st.game) mine[a.round] = a; });
    if (pending && pending.game === st.game && mine[pending.round]) pending = null;
    if (pending) await trySubmit();
    render();
  } catch (e) { /* offline: keep what is on screen, try again */ }
  setTimeout(tick, 3000);
}
setInterval(render, 500);

if (me && code) { started = true; tick(); } else loginView();
</script>
</body>
</html>
